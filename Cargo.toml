[package]
name = "nyano"
version = "0.1.0"
edition = "2024"
description = "a simple nano replacement for quick file edits"

[[bin]]
name = "nyano"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
owo-colors = "4.3"

[profile.release]
opt-level = 3
